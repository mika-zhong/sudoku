<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="解が一つに決まる問題を毎回自動生成する数独ゲーム。メモ、ヒント、やり直しに対応。">
<meta name="color-scheme" content="light dark">
<title>数独</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 盤面を中央に置き、下にテンキー。広い画面では右側に操作パネル。 */
:root {
  --bg: #fcf0f4;
  --panel: #ffffff;
  --ink: #3b1e2b;
  --given: #3b1e2b;
  --entry: #c2185b;
  --line: #efcbd8;
  --line-strong: #5c2d42;
  --hl: #fbe3ec;
  --same: #f8c8da;
  --sel: #f2a3c1;
  --err: #b8360f;
  --err-bg: #ffe0c9;
  --muted: #86586b;
  --accent: #d63384;
  --accent-ink: #ffffff;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e1117; --panel: #2a1820; --ink: #f7e6ee; --given: #f7e6ee; --entry: #ff8fbe;
    --line: #4a2c3a; --line-strong: #d9b0c3; --hl: #3a2130; --same: #5a2944; --sel: #7d3459;
    --err: #ffb07a; --err-bg: #4d2616; --muted: #bb93a4; --accent: #ff8fbe; --accent-ink: #2a0f1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1e1117; --panel: #2a1820; --ink: #f7e6ee; --given: #f7e6ee; --entry: #ff8fbe;
  --line: #4a2c3a; --line-strong: #d9b0c3; --hl: #3a2130; --same: #5a2944; --sel: #7d3459;
  --err: #ffb07a; --err-bg: #4d2616; --muted: #bb93a4; --accent: #ff8fbe; --accent-ink: #2a0f1b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-display); padding-inline: 16px; padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)); }
.app { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 1.8rem; margin: 0; letter-spacing: .08em; }
.stats { display: flex; gap: 16px; font-family: var(--font-num); font-size: .95rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }
.main { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
.board-wrap { flex: 1 1 360px; min-width: 0; max-width: 560px; margin-inline: auto; width: 100%; }
.board { display: grid; grid-template-columns: repeat(9, 1fr); aspect-ratio: 1; border: 3px solid var(--line-strong); background: var(--panel); touch-action: manipulation; }
.cell { position: relative; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: transparent; color: var(--entry); font: 600 clamp(1.1rem, 4.6vw, 1.9rem)/1 var(--font-num); padding: 0; min-width: 0; cursor: pointer; display: grid; place-items: center; }
.cell:nth-child(9n+3), .cell:nth-child(9n+6) { border-right: 2px solid var(--line-strong); }
.cell:nth-child(9n) { border-right: 0; }
.cell:nth-child(n+19):nth-child(-n+27), .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--line-strong); }
.cell:nth-child(n+73) { border-bottom: 0; }
.cell.given { color: var(--given); font-weight: 600; }
.cell.hl { background: var(--hl); }
.cell.same { background: var(--same); }
.cell.sel { background: var(--sel); }
.cell.err { color: var(--err); background: var(--err-bg); }
.cell:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 1; }
.notes { position: absolute; inset: 2px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); font: 400 clamp(.5rem, 2vw, .8rem)/1 var(--font-num); color: var(--muted); }
.notes span { display: grid; place-items: center; }
.notes span.hit { color: var(--accent); font-weight: 600; }
.side { flex: 1 1 240px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; }
button.btn { font: 700 .95rem var(--font-display); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 8px; cursor: pointer; }
button.btn:hover { border-color: var(--accent); }
button.btn[aria-pressed="true"], button.btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.btn:focus-visible, .pad button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
.pad button { position: relative; aspect-ratio: 3/4; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--entry); font: 600 clamp(1.1rem, 4.5vw, 1.6rem) var(--font-num); cursor: pointer; padding: 0; }
.pad button small { position: absolute; bottom: 3px; left: 0; right: 0; font: 400 .65rem var(--font-num); color: var(--muted); }
.pad button:disabled { opacity: .3; cursor: default; }
.pad button:hover:not(:disabled) { border-color: var(--accent); }
.msg { min-height: 1.4em; font-size: .95rem; color: var(--muted); margin: 0; }
.msg.win { color: var(--accent); font-weight: 700; }
.hint-text { font-size: .85rem; color: var(--muted); margin: 0; line-height: 1.6; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
select { font: 500 1rem var(--font-display); padding: 9px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.msg.err { color: var(--err); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.account { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.account .btn { padding: 7px 12px; font-size: .85rem; }
.user { display: flex; align-items: center; gap: 6px; font-size: .9rem; min-width: 0; }
.user span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 12em; }
.avatar { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); object-fit: cover; }
dialog { width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--panel); color: var(--ink); }
dialog::backdrop { background: rgb(40 10 25 / .45); }
.dlg { display: flex; flex-direction: column; gap: 14px; padding: 18px 16px; }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dlg-head h2 { margin: 0; font-size: 1.3rem; letter-spacing: .06em; }
.table-wrap { overflow-x: auto; }
.rank { width: 100%; border-collapse: collapse; font-size: .9rem; }
.rank th { text-align: left; font-weight: 500; font-size: .75rem; letter-spacing: .06em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
.rank td { padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.rank td.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }
.rank th.num { text-align: right; }
.rank td.who { display: flex; align-items: center; gap: 8px; white-space: normal; min-width: 8em; }
.rank td.who img { width: 22px; height: 22px; border-radius: 50%; }
.rank tr.me td { background: var(--hl); font-weight: 700; }
.rank .pos { font-family: var(--font-num); font-weight: 600; color: var(--accent); }
.mybest { margin: 0; font-size: .9rem; color: var(--muted); }
@media (max-width: 560px) { .pad { gap: 4px; } .main { gap: 16px; } .rank .date { display: none; } }
@media (prefers-reduced-motion: no-preference) { .cell { transition: background .08s; } }
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div class="account">
      <button class="btn" id="rankBtn" type="button">ランキング</button>
      <span class="user" id="user" hidden><img class="avatar" id="avatar" alt="" referrerpolicy="no-referrer"><span id="uname"></span></span>
      <button class="btn on" id="login" type="button">Googleでログイン</button>
      <button class="btn" id="logout" type="button" hidden>ログアウト</button>
    </div>
  </div>
  <header>
    <h1>数独</h1>
    <div class="stats"><span>時間 <b id="time">0:00</b></span><span>ミス <b id="miss">0</b></span></div>
  </header>
  <div class="main">
    <div class="board-wrap"><div class="board" id="board" role="grid" aria-label="数独の盤面"></div></div>
    <div class="side">
      <p class="msg" id="msg" aria-live="polite"></p>
      <p class="msg" id="saveMsg" aria-live="polite"></p>
      <div class="pad" id="pad"></div>
      <div class="seg">
        <button class="btn" id="notes" aria-pressed="false">メモ</button>
        <button class="btn" id="erase">消す</button>
        <button class="btn" id="undo">戻す</button>
        <button class="btn" id="hint">ヒント</button>
      </div>
      <label class="field" for="level">難易度
        <select id="level"><option value="40">やさしい</option><option value="32" selected>ふつう</option><option value="27">むずかしい</option></select>
      </label>
      <button class="btn on" id="new">新しいゲーム</button>
      <p class="hint-text">キーボード: 1〜9で入力、矢印キーで移動、Delete/Backspaceで消去、Nでメモ切替、Ctrl+Zで戻す。</p>
    </div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var boardEl = $('board'), padEl = $('pad');
  var BIT = function (n) { return 1 << (n - 1); };

  // ---------- 生成 ----------
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function peers(i) { var r = Math.floor(i / 9), c = i % 9, br = r - r % 3, bc = c - c % 3, out = []; for (var k = 0; k < 9; k++) { out.push(r * 9 + k, k * 9 + c, (br + Math.floor(k / 3)) * 9 + bc + k % 3); } return out; }
  var PEERS = []; for (var p = 0; p < 81; p++) PEERS.push(peers(p));
  function candMask(g, i) { var m = 0; var ps = PEERS[i]; for (var k = 0; k < ps.length; k++) if (g[ps[k]]) m |= BIT(g[ps[k]]); return 511 & ~m; }
  // 解の数を limit まで数える。randomize=true なら最初の解を乱数順で作る。
  function solve(g, limit, randomize) {
    var best = -1, bestMask = 0, bestCount = 10;
    for (var i = 0; i < 81; i++) if (!g[i]) {
      var m = candMask(g, i), n = 0, x = m; while (x) { x &= x - 1; n++; }
      if (n === 0) return 0;
      if (n < bestCount) { bestCount = n; best = i; bestMask = m; if (n === 1) break; }
    }
    if (best < 0) return 1;
    var opts = []; for (var d = 1; d <= 9; d++) if (bestMask & BIT(d)) opts.push(d);
    if (randomize) shuffle(opts);
    var total = 0;
    for (var o = 0; o < opts.length; o++) {
      g[best] = opts[o];
      total += solve(g, limit - total, randomize);
      if (total >= limit) { if (!randomize) g[best] = 0; return total; }
      if (randomize && total > 0) return total;
      g[best] = 0;
    }
    return total;
  }
  function generate(clues) {
    var sol = new Array(81).fill(0); solve(sol, 1, true);
    var puz = sol.slice(), order = shuffle(Array.from({ length: 81 }, function (_, i) { return i; })), left = 81;
    for (var k = 0; k < order.length && left > clues; k++) {
      var i = order[k], keep = puz[i]; puz[i] = 0;
      var copy = puz.slice();
      if (solve(copy, 2, false) !== 1) puz[i] = keep; else left--;
    }
    return { puzzle: puz, solution: sol };
  }

  // ---------- 状態 ----------
  var S = { puzzle: [], solution: [], v: [], notes: [], sel: -1, noteMode: false, hist: [], miss: 0, hints: 0, secs: 0, over: false, level: 'normal' };
  var LEVEL_KEY = { '40': 'easy', '32': 'normal', '27': 'hard' };
  var timer = null;

  function newGame() {
    var g = generate(parseInt($('level').value, 10));
    S.puzzle = g.puzzle; S.solution = g.solution; S.v = g.puzzle.slice();
    S.notes = new Array(81).fill(0); S.hist = []; S.miss = 0; S.hints = 0; S.secs = 0; S.over = false; S.sel = -1;
    S.level = LEVEL_KEY[$('level').value];
    clearInterval(timer); timer = setInterval(function () { if (!S.over) { S.secs++; renderStats(); } }, 1000);
    setMsg('');
    render();
    document.dispatchEvent(new CustomEvent('sudoku:new'));
  }
  function setMsg(t, win) { var m = $('msg'); m.textContent = t; m.className = 'msg' + (win ? ' win' : ''); }
  function fmt(s) { return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function renderStats() { $('time').textContent = fmt(S.secs); $('miss').textContent = S.miss; }

  function conflicts() {
    var bad = {};
    for (var i = 0; i < 81; i++) if (S.v[i]) {
      var ps = PEERS[i]; for (var k = 0; k < ps.length; k++) if (ps[k] !== i && S.v[ps[k]] === S.v[i]) { bad[i] = true; break; }
    }
    return bad;
  }

  // ---------- 描画 ----------
  function build() {
    for (var i = 0; i < 81; i++) {
      var b = document.createElement('button');
      b.className = 'cell'; b.type = 'button'; b.dataset.i = i; b.setAttribute('role', 'gridcell');
      boardEl.appendChild(b);
    }
    for (var n = 1; n <= 9; n++) {
      var pb = document.createElement('button'); pb.type = 'button'; pb.dataset.n = n; pb.innerHTML = n + '<small></small>';
      padEl.appendChild(pb);
    }
  }
  function render() {
    var bad = conflicts(), cells = boardEl.children, sv = S.sel >= 0 ? S.v[S.sel] : 0, counts = new Array(10).fill(0);
    for (var i = 0; i < 81; i++) {
      var el = cells[i], val = S.v[i], cls = 'cell';
      if (S.puzzle[i]) cls += ' given';
      if (S.sel >= 0) {
        if (i === S.sel) cls += ' sel';
        else if (sv && val === sv) cls += ' same';
        else if (PEERS[S.sel].indexOf(i) >= 0) cls += ' hl';
      }
      if (bad[i] && !S.puzzle[i]) cls += ' err';
      el.className = cls;
      if (val) { el.textContent = val; counts[val]++; }
      else if (S.notes[i]) {
        var h = '<div class="notes">'; for (var d = 1; d <= 9; d++) h += '<span' + (sv === d ? ' class="hit"' : '') + '>' + (S.notes[i] & BIT(d) ? d : '') + '</span>'; el.innerHTML = h + '</div>';
      } else el.textContent = '';
      el.setAttribute('aria-label', (Math.floor(i / 9) + 1) + '行' + (i % 9 + 1) + '列 ' + (val ? val : '空'));
    }
    var pads = padEl.children;
    for (var n = 1; n <= 9; n++) { pads[n - 1].disabled = counts[n] >= 9 || S.over; pads[n - 1].querySelector('small').textContent = '残' + Math.max(0, 9 - counts[n]); }
    $('notes').setAttribute('aria-pressed', S.noteMode);
    renderStats();
  }

  // ---------- 操作 ----------
  function push() { S.hist.push({ v: S.v.slice(), notes: S.notes.slice(), miss: S.miss }); if (S.hist.length > 200) S.hist.shift(); }
  function clearPeerNotes(i, n) { PEERS[i].forEach(function (p) { S.notes[p] &= ~BIT(n); }); }
  function place(n) {
    var i = S.sel; if (i < 0 || S.over || S.puzzle[i]) return;
    if (S.noteMode) {
      if (S.v[i]) return;
      push(); S.notes[i] ^= BIT(n);
    } else {
      if (S.v[i] === n) return;
      push(); S.v[i] = n; S.notes[i] = 0;
      if (n !== S.solution[i]) { S.miss++; setMsg('この数字は合っていません。'); }
      else { setMsg(''); clearPeerNotes(i, n); }
    }
    render(); checkWin();
  }
  function erase() { var i = S.sel; if (i < 0 || S.over || S.puzzle[i]) return; if (!S.v[i] && !S.notes[i]) return; push(); S.v[i] = 0; S.notes[i] = 0; render(); }
  function undo() { var h = S.hist.pop(); if (!h || S.over) return; S.v = h.v; S.notes = h.notes; S.miss = h.miss; render(); }
  function hint() {
    if (S.over) return;
    var i = S.sel;
    if (i < 0 || S.puzzle[i] || S.v[i] === S.solution[i]) {
      var empt = []; for (var k = 0; k < 81; k++) if (S.v[k] !== S.solution[k]) empt.push(k);
      if (!empt.length) return; i = empt[Math.floor(Math.random() * empt.length)]; S.sel = i;
    }
    push(); S.hints++; S.v[i] = S.solution[i]; S.notes[i] = 0; clearPeerNotes(i, S.v[i]); setMsg('ヒントを使いました。'); render(); checkWin();
  }
  function checkWin() {
    for (var i = 0; i < 81; i++) if (S.v[i] !== S.solution[i]) return;
    S.over = true; clearInterval(timer);
    setMsg('クリア！ タイム ' + fmt(S.secs) + '、ミス ' + S.miss + ' 回。', true); render();
    document.dispatchEvent(new CustomEvent('sudoku:clear', { detail: { level: S.level, time: S.secs, miss: S.miss, hints: S.hints } }));
  }
  function move(dr, dc) {
    var i = S.sel < 0 ? 40 : S.sel, r = Math.max(0, Math.min(8, Math.floor(i / 9) + dr)), c = Math.max(0, Math.min(8, i % 9 + dc));
    S.sel = r * 9 + c; render(); boardEl.children[S.sel].focus();
  }

  boardEl.addEventListener('click', function (e) { var b = e.target.closest('.cell'); if (b) { S.sel = +b.dataset.i; render(); } });
  padEl.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b && !b.disabled) place(+b.dataset.n); });
  $('notes').onclick = function () { S.noteMode = !S.noteMode; render(); };
  $('erase').onclick = erase; $('undo').onclick = undo; $('hint').onclick = hint; $('new').onclick = newGame;
  $('level').onchange = newGame;
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'SELECT' || document.querySelector('dialog[open]')) return;
    if (e.ctrlKey || e.metaKey) { if (e.key === 'z') { e.preventDefault(); undo(); } return; }
    if (/^[1-9]$/.test(e.key)) place(+e.key);
    else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') { e.preventDefault(); erase(); }
    else if (e.key === 'n' || e.key === 'N') { S.noteMode = !S.noteMode; render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1, 0); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); move(1, 0); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); move(0, -1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); move(0, 1); }
  });

  build(); newGame();
})();
</script>

<dialog id="rankDlg" aria-labelledby="rankTitle">
  <div class="dlg">
    <div class="dlg-head">
      <h2 id="rankTitle">ランキング</h2>
      <form method="dialog"><button class="btn" type="submit">閉じる</button></form>
    </div>
    <div class="seg" id="rankTabs">
      <button class="btn" type="button" data-level="easy" aria-pressed="false">やさしい</button>
      <button class="btn" type="button" data-level="normal" aria-pressed="true">ふつう</button>
      <button class="btn" type="button" data-level="hard" aria-pressed="false">むずかしい</button>
    </div>
    <p class="mybest" id="myBest"></p>
    <p class="msg" id="rankStatus" aria-live="polite"></p>
    <div class="table-wrap">
      <table class="rank">
        <thead><tr><th>順位</th><th>名前</th><th class="num">タイム</th><th class="num">ミス</th><th class="date">日付</th></tr></thead>
        <tbody id="rankBody"></tbody>
      </table>
    </div>
    <p class="hint-text">クリアタイムが速い順に上位20件を表示します。ヒントを使ったゲームは記録されません。</p>
  </div>
</dialog>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, addDoc, serverTimestamp, query, where, orderBy, limit, getDocs, getCountFromServer } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: 'AIzaSyBQUUP-DCXDLJl5CpB6bRwpmGvDgqEPQYc',
  authDomain: 'sudoku-e66c5.firebaseapp.com',
  projectId: 'sudoku-e66c5',
  storageBucket: 'sudoku-e66c5.firebasestorage.app',
  messagingSenderId: '287739096358',
  appId: '1:287739096358:web:08710c17ab387f1e15e5e7'
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

const LEVELS = { easy: 'やさしい', normal: 'ふつう', hard: 'むずかしい' };
const LEVEL_KEY = { '40': 'easy', '32': 'normal', '27': 'hard' };
const $ = (id) => document.getElementById(id);
const scores = (level) => collection(db, 'rankings', level, 'scores');
const fmt = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

let user = null;
let pending = null;   // ログイン前にクリアした記録
let shown = 'normal'; // ランキングで表示中の難易度

function setSave(text, kind) {
  const m = $('saveMsg');
  m.textContent = text;
  m.className = 'msg' + (kind ? ' ' + kind : '');
}

// ---------- ログイン ----------
onAuthStateChanged(auth, (u) => {
  user = u;
  $('login').hidden = !!u;
  $('logout').hidden = !u;
  $('user').hidden = !u;
  if (u) {
    $('uname').textContent = u.displayName || '名無し';
    $('avatar').hidden = !u.photoURL;
    if (u.photoURL) $('avatar').src = u.photoURL;
    if (pending) { const r = pending; pending = null; save(r); }
  }
  if ($('rankDlg').open) load(shown);
});

$('login').addEventListener('click', async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
    if (e.code === 'auth/popup-blocked') setSave('ポップアップがブロックされました。ブラウザでこのサイトのポップアップを許可してください。', 'err');
    else setSave('ログインできませんでした(' + e.code + ')。', 'err');
  }
});
$('logout').addEventListener('click', () => signOut(auth));

// ---------- 記録 ----------
document.addEventListener('sudoku:new', () => { pending = null; setSave(''); });
document.addEventListener('sudoku:clear', (e) => {
  const r = e.detail;
  if (r.hints > 0) { setSave('ヒントを使ったので、この記録はランキングに登録されません。'); return; }
  if (!user) { pending = r; setSave('ログインすると、この記録をランキングに登録できます。'); return; }
  save(r);
});

async function save(r) {
  setSave('記録を保存しています…');
  try {
    await addDoc(scores(r.level), {
      uid: user.uid,
      name: (user.displayName || '名無し').slice(0, 50),
      photo: user.photoURL || null,
      time: r.time,
      miss: r.miss,
      createdAt: serverTimestamp()
    });
    const faster = await getCountFromServer(query(scores(r.level), where('time', '<', r.time)));
    setSave('ランキングに登録しました。' + LEVELS[r.level] + 'で ' + (faster.data().count + 1) + ' 位です。', 'win');
  } catch (e) {
    setSave('記録を保存できませんでした(' + (e.code || e.message) + ')。', 'err');
  }
}

// ---------- ランキング ----------
function cell(text, cls) {
  const td = document.createElement('td');
  if (cls) td.className = cls;
  td.textContent = text;
  return td;
}

async function load(level) {
  shown = level;
  document.querySelectorAll('#rankTabs button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.level === level));
  const body = $('rankBody');
  body.replaceChildren();
  $('rankStatus').textContent = '読み込んでいます…';
  $('myBest').textContent = '';
  try {
    const snap = await getDocs(query(scores(level), orderBy('time'), limit(20)));
    $('rankStatus').textContent = snap.empty ? 'まだ記録がありません。最初にクリアした人が1位です。' : '';
    snap.docs.forEach((d, i) => {
      const s = d.data();
      const tr = document.createElement('tr');
      if (user && s.uid === user.uid) tr.className = 'me';
      tr.appendChild(cell(String(i + 1), 'pos'));
      const who = cell('', 'who');
      if (s.photo) {
        const img = document.createElement('img');
        img.src = s.photo; img.alt = ''; img.referrerPolicy = 'no-referrer';
        who.appendChild(img);
      }
      who.appendChild(document.createTextNode(s.name || '名無し'));
      tr.appendChild(who);
      tr.appendChild(cell(fmt(s.time), 'num'));
      tr.appendChild(cell(String(s.miss), 'num'));
      tr.appendChild(cell(s.createdAt ? s.createdAt.toDate().toLocaleDateString('ja-JP') : '', 'date'));
      body.appendChild(tr);
    });
    if (user) {
      const mine = await getDocs(query(scores(level), where('uid', '==', user.uid)));
      if (mine.empty) $('myBest').textContent = 'あなたの' + LEVELS[level] + 'の記録はまだありません。';
      else {
        const best = Math.min(...mine.docs.map((d) => d.data().time));
        $('myBest').textContent = 'あなたのベスト: ' + fmt(best) + '(' + mine.size + '回クリア)';
      }
    } else {
      $('myBest').textContent = 'ログインすると自分の記録を登録できます。';
    }
  } catch (e) {
    $('rankStatus').textContent = 'ランキングを読み込めませんでした(' + (e.code || e.message) + ')。';
  }
}

$('rankTabs').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b) load(b.dataset.level);
});
$('rankBtn').addEventListener('click', () => {
  $('rankDlg').showModal();
  load(LEVEL_KEY[$('level').value]);
});
</script>
</body>
</html>
